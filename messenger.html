<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Messenger — Norlo Dispatch</title>
<style>
  :root{
    --bg:#0e1114; --panel:#161a1f; --panel-2:#1c2229; --line:#262d35;
    --ink:#e6ebf0; --ink-dim:#8b97a4; --ink-faint:#5d6874;
    --driver:#1f2a35; --dispatch:#1e3a2c; --system:#20242a;
    --accent:#4ea3ff; --alert:#e0a33a; --good:#3fb96b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden}
  button,input,textarea{font:inherit;color:inherit}

  /* ---- shell ---- */
  #app{display:grid;height:100%;grid-template-rows:auto 1fr}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.03em}
  header .sub{color:var(--ink-faint);font-size:11px;font-family:var(--mono)}
  header .spacer{flex:1}
  header button{padding:6px 12px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;cursor:pointer;font-size:12px}
  header button:hover{border-color:var(--accent)}
  #who{width:110px;padding:6px 10px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;outline:none;font-size:12px}
  #who:focus{border-color:var(--accent)}

  main{display:grid;grid-template-columns:290px 1fr;min-height:0}

  /* ---- driver list ---- */
  #side{display:flex;flex-direction:column;min-height:0;
    background:var(--panel);border-right:1px solid var(--line)}
  #search{margin:10px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;outline:none}
  #search:focus{border-color:var(--accent)}
  #list{flex:1;overflow-y:auto}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;
    border-left:3px solid transparent}
  .row:hover{background:var(--panel-2)}
  .row.on{background:var(--panel-2);border-left-color:var(--accent)}
  .row.wait{border-left-color:var(--alert)}
  .row .top{display:flex;align-items:baseline;gap:8px}
  .row .nm{font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .row .id{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .row .pv{margin-top:3px;color:var(--ink-dim);font-size:12px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .when{margin-top:3px;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .row.wait .when{color:var(--alert)}

  /* ---- thread ---- */
  #pane{display:flex;flex-direction:column;min-height:0}
  #head{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:baseline}
  #head .nm{font-size:15px;font-weight:600}
  #head .id{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:8px}
  #back{display:none;margin-right:10px;padding:4px 10px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px}
  #turns{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:64%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;
    word-break:break-word;font-size:13.5px}
  .msg .meta{margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .in{align-self:flex-start;background:var(--driver);border-bottom-left-radius:3px}
  .out{align-self:flex-end;background:var(--dispatch);border-bottom-right-radius:3px}
  .sys{align-self:center;max-width:78%;background:var(--system);color:var(--ink-dim);
    border:1px solid var(--line);border-radius:7px;font-size:12.5px}
  .sys .tag{display:block;margin-bottom:5px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.09em;color:var(--ink-faint)}

  #compose{padding:12px 18px;border-top:1px solid var(--line);background:var(--panel);
    display:flex;gap:10px;align-items:flex-end}
  #box{flex:1;min-height:42px;max-height:150px;padding:10px 12px;resize:none;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;outline:none}
  #box:focus{border-color:var(--accent)}
  #send{padding:10px 20px;background:var(--accent);color:#08121c;border:0;border-radius:8px;
    font-weight:600;cursor:pointer;white-space:nowrap}
  #send:disabled{opacity:.4;cursor:default}
  #hint{padding:0 18px 10px;font-size:11px;color:var(--ink-faint);background:var(--panel)}

  .blank{margin:auto;color:var(--ink-faint);font-size:13px;text-align:center}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:#2b333c;border-radius:5px}

  /* ---- narrow: Front sidebar / phone ---- */
  @media (max-width:700px){
    main{grid-template-columns:1fr}
    #side{grid-column:1;grid-row:1}
    #pane{display:none}
    body.viewing #side{display:none}
    body.viewing #pane{display:flex}
    .msg{max-width:88%}
    #back{display:inline-block}
    header h1{display:none}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Driver Messenger</h1>
    <span class="sub" id="stat">loading…</span>
    <span class="spacer"></span>
    <button onclick="loadThreads(true)">Refresh</button>
    <input id="who" placeholder="Your initials" oninput="saveWho()">
  </header>

  <main>
    <div id="side">
      <input id="search" placeholder="Filter by name or ID" oninput="renderList()">
      <div id="list"></div>
    </div>

    <div id="pane">
      <div id="head" style="display:none">
        <button id="back" onclick="backToList()">←</button>
        <span class="nm" id="hNm"></span><span class="id" id="hId"></span>
      </div>
      <div id="turns"><div class="blank">Pick a driver to see the conversation.</div></div>
      <div id="compose" style="display:none">
        <textarea id="box" rows="1" placeholder="Message the driver…"
                  oninput="grow(this)" onkeydown="maybeSend(event)"></textarea>
        <button id="send" onclick="send()">Send</button>
      </div>
      <div id="hint" style="display:none">Enter sends · Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<script>
/* ── config ───────────────────────────────────────────────────────────── */
var API   = "https://script.google.com/macros/s/AKfycbwebUzD1R2EyGryuFOhmTrl9V3nPElvT2OLW6JRrQ9hhaNyB_1eLh4j6JbOLM2aPyYP/exec";   // ends in /exec
var TOKEN = "8U+54ldJ0U5V4pmac7gA8ez+yhsN01MW/jECyMYsrCU=";

var LIST_MS   = 60000;   // driver list refresh
var THREAD_MS = 20000;   // open conversation refresh

/* ── state ────────────────────────────────────────────────────────────── */
var threads = [], current = null, sender = "", listTimer, threadTimer;

/* ── boot ─────────────────────────────────────────────────────────────── */
function saveWho(){
  sender = document.getElementById("who").value.trim();
  localStorage.setItem("norlo_who", sender);
}

function start(){
  sender = localStorage.getItem("norlo_who") || "";
  document.getElementById("who").value = sender;
  loadThreads(true);
  listTimer = setInterval(function(){ loadThreads(false); }, LIST_MS);

  var d = new URLSearchParams(location.search).get("driver");
  if (d) setTimeout(function(){ openThread(d.toUpperCase()); }, 800);
}

start();

/* ── data ─────────────────────────────────────────────────────────────── */
function call(params){
  var q = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
  }).join("&");
  return fetch(API + "?token=" + encodeURIComponent(TOKEN) + "&" + q)
    .then(function(r){ return r.json(); });
}

function loadThreads(loud){
  if (loud) document.getElementById("stat").textContent = "loading…";
  call({action:"threads"}).then(function(d){
    if (d.error) throw new Error(d.error);
    threads = d.threads || [];
    var waiting = threads.filter(function(t){ return t.needsReply; }).length;
    document.getElementById("stat").textContent =
      threads.length + " drivers · " + waiting + " awaiting reply · " + clock();
    renderList();
  }).catch(function(e){
    document.getElementById("stat").textContent = "error: " + e.message;
  });
}

function openThread(id){
  current = id;
  document.body.classList.add("viewing");
  clearInterval(threadTimer);
  threadTimer = setInterval(function(){ fetchThread(id, false); }, THREAD_MS);
  fetchThread(id, true);
  renderList();
}

function backToList(){
  current = null;
  clearInterval(threadTimer);
  document.body.classList.remove("viewing");
  renderList();
}

function fetchThread(id, scroll){
  call({action:"thread", driver:id}).then(function(d){
    if (d.error || current !== id) return;
    var t = threads.filter(function(x){ return x.driverId === id; })[0] || {};
    document.getElementById("head").style.display    = "flex";
    document.getElementById("compose").style.display = "flex";
    document.getElementById("hint").style.display    = "block";
    document.getElementById("hNm").textContent = pretty(d.driverName || t.driverName || id);
    document.getElementById("hId").textContent = id;
    renderTurns(d.turns || [], scroll);
  });
}

/* ── render ───────────────────────────────────────────────────────────── */
function renderList(){
  var q = document.getElementById("search").value.trim().toLowerCase();
  var el = document.getElementById("list");

  var show = threads.filter(function(t){
    if (!q) return true;
    return (t.driverName||"").toLowerCase().indexOf(q) > -1 ||
           (t.driverId||"").toLowerCase().indexOf(q) > -1;
  });

  if (!show.length){
    el.innerHTML = '<div class="blank" style="padding:30px 14px">No drivers match.</div>';
    return;
  }

  el.innerHTML = show.map(function(t){
    var cls = "row" + (t.needsReply ? " wait" : "") + (t.driverId === current ? " on" : "");
    return '<div class="' + cls + '" onclick="openThread(\'' + t.driverId + '\')">' +
             '<div class="top">' +
               '<span class="nm">' + esc(pretty(t.driverName || t.driverId)) + '</span>' +
               '<span class="id">' + esc(t.driverId) + '</span>' +
             '</div>' +
             '<div class="pv">' + esc(t.last || "") + '</div>' +
             '<div class="when">' + when(t.lastAt) +
               (t.needsReply ? " · awaiting reply" : "") + '</div>' +
           '</div>';
  }).join("");
}

function renderTurns(turns, scroll){
  var el = document.getElementById("turns");
  if (!turns.length){
    el.innerHTML = '<div class="blank">Nothing here yet. Send the first message.</div>';
    return;
  }

  el.innerHTML = turns.map(function(t){
    var sys = isSystem(t.text);
    var who = t.direction === "IN" ? "in" : "out";
    var cls = sys ? "msg sys" : "msg " + who;
    var tag = sys ? '<span class="tag">' + sysLabel(t.text) + '</span>' : "";
    var by  = t.direction === "IN" ? "driver" : shortMail(t.sender);
    return '<div class="' + cls + '">' + tag + esc(t.text) +
             '<div class="meta">' + when(t.at) + (by ? " · " + esc(by) : "") + '</div>' +
           '</div>';
  }).join("");

  if (scroll) el.scrollTop = el.scrollHeight;
}

/* ── send ─────────────────────────────────────────────────────────────── */
function send(){
  var box = document.getElementById("box");
  var txt = box.value.trim();
  if (!txt || !current) return;

  var btn = document.getElementById("send");
  btn.disabled = true; btn.textContent = "Sending…";

  call({action:"send", driver:current, text:txt, sender:sender}).then(function(d){
    if (d.error) throw new Error(d.error);
    box.value = ""; grow(box);
    fetchThread(current, true);
    loadThreads(false);
  }).catch(function(e){
    alert("Didn't send: " + e.message);
  }).then(function(){
    btn.disabled = false; btn.textContent = "Send";
    box.focus();
  });
}

function maybeSend(e){
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
}
function grow(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 150) + "px";
}

/* ── helpers ──────────────────────────────────────────────────────────── */
function isSystem(s){
  return /^(Incident Submitted|Changes for Order|ALERT!|ASR is updated)/i.test(s || "");
}
function sysLabel(s){
  if (/^Incident Submitted/i.test(s)) return "COACHING";
  if (/^ALERT!/i.test(s))             return "TRIP ALERT";
  if (/^Changes for Order/i.test(s))  return "DISPATCH UPDATE";
  return "SYSTEM";
}
function pretty(n){
  if (!n) return "";
  var p = String(n).split(",");
  return p.length === 2 ? (p[1].trim() + " " + p[0].trim()) : n;
}
function shortMail(s){
  var m = String(s || "").match(/[\w.\-+]+@/);
  return m ? m[0].slice(0, -1) : "";
}
function when(iso){
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d)) return "";
  var now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  var t = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  return sameDay ? t : (d.getMonth()+1) + "/" + d.getDate() + " " + t;
}
function clock(){
  return new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
